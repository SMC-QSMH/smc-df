<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4452">
<title>SMC DF — ค่าธรรมเนียมแพทย์ คลินิกพิเศษเฉพาะทางนอกเวลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2569-10-13.1">
</head>
<body>

<div id="boot" class="boot"><div class="boot-mark">SMC<span>DF</span></div><div class="boot-text">กำลังเปิดระบบ…</div></div>

<!-- หน้าเข้าสู่ระบบ -->
<div id="login" class="login hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-mark">SMC<span>DF</span></div>
    <h1>ระบบรายงานและตรวจสอบค่าธรรมเนียมแพทย์</h1>
    <p class="login-sub">คลินิกพิเศษเฉพาะทางนอกเวลา · กลุ่มทันตกรรม<br>โรงพยาบาลสมเด็จพระบรมราชเทวี ณ ศรีราชา สภากาชาดไทย</p>
    <label class="fld"><span>รหัสเจ้าหน้าที่</span>
      <input id="liCode" inputmode="numeric" autocomplete="username" required>
    </label>
    <label class="fld"><span>รหัสผ่าน</span>
      <span class="pw"><input id="liPass" type="password" autocomplete="current-password" required>
      <button type="button" class="eye" id="liEye" aria-label="แสดงรหัสผ่าน">ดู</button></span>
    </label>
    <div id="liMsg" class="msg hidden"></div>
    <button class="btn primary wide" id="liGo" type="submit">เข้าสู่ระบบ</button>
    <div class="login-foot"><span id="liConn">กำลังตรวจการเชื่อมต่อ…</span></div>
  </form>
</div>

<!-- โครงหน้าหลัก -->
<div id="shell" class="shell hidden">
  <aside class="side" id="side">
    <div class="side-head">
      <div class="side-mark">SMC<span>DF</span></div>
      <div class="side-name">ค่าธรรมเนียมแพทย์<small>คลินิกทันตกรรมนอกเวลา</small></div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="side-foot">
      <div class="who"><b id="meName">—</b><small id="meRole">—</small></div>
      <button class="btn ghost sm" id="btnLogout">ออกจากระบบ</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon-btn" id="btnSide" aria-label="เมนู">☰</button>
      <div class="top-title" id="pageTitle">รายงานประจำวัน</div>
      <div class="top-right">
        <span class="pill" id="dataPill"></span>
      </div>
    </header>
    <div id="verWarn" class="ribbon hidden"></div>
    <div id="page" class="page"></div>
    <footer class="foot">
      <span id="footLine"></span>
      <button class="link" id="btnAbout">ⓘ รายละเอียดระบบ</button>
    </footer>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js?v=2569-10-13.1"></script>
<script src="app.js?v=2569-10-13.1"></script>
<script src="pages.js?v=2569-10-13.1"></script>
<script src="reports.js?v=2569-10-13.1"></script>
<script>SMCDF.start();</script>
</body>
</html>
